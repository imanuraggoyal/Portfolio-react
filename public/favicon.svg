<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="4" />

  <!-- Monogram Initials AG -->
  <text x="50" y="62" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#brandGrad)" text-anchor="middle" letter-spacing="-1">AG</text>

  <!-- Glowing Status Dot -->
  <circle cx="78" cy="22" r="6" fill="#22d3ee" />
</svg>
