<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Anurag Goyal - Senior Software Engineer specializing in Java, Spring Boot, Microservices, API Performance Optimization, and Cloud Architecture." />
    <title>Anurag Goyal | Software Engineer Portfolio</title>

    <!-- Google Fonts: Outfit (Headings) + Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent FOUC: Apply initial dark mode from localStorage or default to dark -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme');
          const isDark = stored ? stored === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-bg-light dark:bg-bg-dark text-text-light dark:text-text-dark font-sans antialiased min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
